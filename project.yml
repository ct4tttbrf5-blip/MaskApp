name: MaskApp
options:
  bundleIdPrefix: com.dnjswork
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
settings:
  base:
    # Xcode 26 ships Swift 6.3. Keep Swift 5 language mode for compatibility
    # (avoids Swift 6 strict concurrency errors in SwiftUI / CoreBluetooth code).
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CLANG_ENABLE_MODULES: "YES"
# Explicit scheme: Xcode 26 requires -scheme whenever -derivedDataPath is used.
schemes:
  MaskApp:
    build:
      targets:
        MaskApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  MaskApp:
    type: application
    platform: iOS
    sources:
      - path: MaskApp
    settings:
      base:
        # 引用已有 Info.plist。不要用 info.path —— 那会让 XcodeGen 覆盖写入该文件，
        # 丢掉 NSBluetoothAlwaysUsageDescription 与 UIBackgroundModes。
        INFOPLIST_FILE: MaskApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dnjswork.maskapp
        PRODUCT_NAME: MaskApp
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
