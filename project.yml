name: MaskApp
options:
  bundleIdPrefix: com.dnjswork
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CLANG_ENABLE_MODULES: "YES"
targets:
  MaskApp:
    type: application
    platform: iOS
    sources:
      - path: MaskApp
    settings:
      base:
        # 引用已有 Info.plist。不要用 info.path —— 那会让 XcodeGen 覆盖写入该文件，
        # 丢掉 NSBluetoothAlwaysUsageDescription 与 UIBackgroundModes。
        INFOPLIST_FILE: MaskApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dnjswork.maskapp
        PRODUCT_NAME: MaskApp
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
