name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Release for device, unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project MaskApp.xcodeproj \
            -scheme MaskApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MaskApp.app"
          if [ ! -d "$APP" ]; then
            echo "Built app not found at $APP"
            find build -maxdepth 6 -name '*.app' -print
            exit 1
          fi
          rm -rf Payload MaskApp-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MaskApp-unsigned.ipa Payload
          echo "Packaged:"
          ls -lh MaskApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaskApp-unsigned-ipa
          path: MaskApp-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
